kind = "web"
previewPath = "/"
title = "بوابة الحراسات المدرسية"
version = "1.0.0"
id = "artifacts/school-guards"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22426

[services.development]
run = "pnpm --filter @workspace/school-guards run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-guards", "run", "build" ]
publicDir = "artifacts/school-guards/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22426"
BASE_PATH = "/"
